<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Create attendance QR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .qr-card { text-align: center; margin-top: 24px; }
  #qr { display: inline-block; padding: 14px; background: #fff; border: 1px solid var(--line); border-radius: 10px; }
  #qr img { display: block; }
  .qr-card h2 { margin: 16px 0 2px; font-size: 1.25rem; }
  .qr-card p { margin: 0; color: var(--muted); }
  .actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 18px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Create attendance QR</h1>
  <p class="sub">Pick the session details, then show the QR code to your participants.</p>

  <div class="card" id="formCard">
    <label for="trainer">Trainer</label>
    <select id="trainer"><option value="">Loading…</option></select>

    <label for="audience">Who is this session for?</label>
    <select id="audience">
      <option value="ASM">ASM</option>
      <option value="Sales">Sales employees</option>
      <option value="Retailer">Retailers</option>
    </select>

    <label>Topics</label>
    <div class="hint" style="margin-top:0">Tick every topic covered. Most sessions have 2 or 3.</div>
    <div id="topics" class="checks"></div>
    <div class="inline">
      <input id="topicOther" type="text" placeholder="Other topic: type it here" maxlength="100">
      <button id="addTopic" type="button" class="ghost">Add topic</button>
    </div>

    <label for="date">Date</label>
    <input id="date" type="date">

    <label for="batch">Batch (optional)</label>
    <input id="batch" type="text" maxlength="40" placeholder="Only if you run two sessions on one day, e.g. Morning">

    <button id="go" class="block" type="button">Generate QR</button>
    <div id="msg" class="msg err" hidden></div>
  </div>

  <div class="card qr-card" id="result" hidden>
    <div id="qr"></div>
    <h2 id="rTopic"></h2>
    <p id="rMeta"></p>
    <div class="actions">
      <button id="dl" type="button">Download QR image</button>
      <button id="copy" type="button" class="ghost">Copy link</button>
    </div>
    <p class="hint" id="copied" hidden>Link copied.</p>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="config.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const AUD = { ASM: "ASM", Sales: "Sales employees", Retailer: "Retailers" };
let currentUrl = "";
let currentInfo = null;

function todayISO() {
  const d = new Date();
  const off = d.getTimezoneOffset() * 60000;
  return new Date(d - off).toISOString().slice(0, 10);
}

function showError(text) {
  const m = $("msg");
  m.textContent = text;
  m.hidden = !text;
}

function slug(s) {
  return String(s).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 40);
}

function formatDate(iso) {
  return new Date(iso + "T00:00:00").toLocaleDateString("en-IN", { day: "numeric", month: "short", year: "numeric" });
}

function metaText(info) {
  return info.trainer + ", " + formatDate(info.date) + (info.batch ? ", " + info.batch : "") +
    (info.audience && info.audience !== "ASM" ? ", " + AUD[info.audience] : "");
}

function addTopicBox(name, checked) {
  const existing = Array.from(document.querySelectorAll("#topics input"))
    .find((i) => i.value.toLowerCase() === name.toLowerCase());
  if (existing) { existing.checked = true; return; }
  const label = document.createElement("label");
  const cb = document.createElement("input");
  cb.type = "checkbox"; cb.value = name; cb.checked = !!checked;
  label.appendChild(cb);
  label.appendChild(document.createTextNode(name));
  $("topics").appendChild(label);
}

function selectedTopics() {
  return Array.from(document.querySelectorAll("#topics input:checked")).map((i) => i.value);
}

async function init() {
  $("date").value = todayISO();
  if (!scriptReady()) {
    showError("Setup incomplete: add your Apps Script URL in config.js.");
    $("trainer").innerHTML = "<option>Not available</option>";
    $("go").disabled = true;
    return;
  }
  try {
    const cfg = await apiGet({ action: "config" });
    if (cfg.error) throw new Error(cfg.error);
    const sel = $("trainer");
    sel.innerHTML = "";
    sel.add(new Option("Select your name", ""));
    (cfg.trainers || []).forEach((t) => sel.add(new Option(t, t)));
    (cfg.topics || []).forEach((t) => addTopicBox(t, false));
  } catch (e) {
    showError("Could not load trainers and topics. Check your internet connection and refresh.");
    $("trainer").innerHTML = "<option>Not available</option>";
  }
}

function addOtherTopic() {
  const v = $("topicOther").value.trim();
  if (!v) return;
  addTopicBox(v, true);
  $("topicOther").value = "";
}
$("addTopic").addEventListener("click", addOtherTopic);
$("topicOther").addEventListener("keydown", (e) => {
  if (e.key === "Enter") { e.preventDefault(); addOtherTopic(); }
});

$("go").addEventListener("click", async () => {
  showError("");
  addOtherTopic(); // pick up a topic that was typed but not added yet
  const trainer = $("trainer").value;
  const topics = selectedTopics();
  const date = $("date").value;
  const batch = $("batch").value.trim();
  const audience = $("audience").value;
  if (!trainer) return showError("Select your name.");
  if (!topics.length) return showError("Tick at least one topic, or add one under Other.");
  if (!date) return showError("Select the session date.");

  const btn = $("go");
  btn.disabled = true;
  btn.textContent = "Creating QR…";
  try {
    const res = await apiPost({ action: "createSession", trainer, topics, date, batch, audience });
    if (res.error || !res.code) throw new Error(res.error || "No session code returned.");

    const url = new URL("attend.html", location.href);
    url.searchParams.set("c", res.code);
    currentUrl = url.toString();
    currentInfo = { trainer, topics, date, batch, audience };

    const box = $("qr");
    box.innerHTML = "";
    new QRCode(box, { text: currentUrl, width: 300, height: 300, correctLevel: QRCode.CorrectLevel.M });

    $("rTopic").textContent = topics.join(", ");
    $("rMeta").textContent = metaText(currentInfo);
    $("copied").hidden = true;
    $("result").hidden = false;
    $("result").scrollIntoView({ behavior: "smooth", block: "start" });
  } catch (e) {
    showError("Could not create the QR code. " + e.message);
  }
  btn.disabled = false;
  btn.textContent = "Generate QR";
});

function wrapText(ctx, text, maxWidth) {
  const words = text.split(/\s+/);
  const lines = [];
  let line = "";
  words.forEach((w) => {
    const test = line ? line + " " + w : w;
    if (ctx.measureText(test).width > maxWidth && line) { lines.push(line); line = w; } else { line = test; }
  });
  if (line) lines.push(line);
  return lines;
}

$("dl").addEventListener("click", () => {
  const qrCanvas = $("qr").querySelector("canvas");
  if (!qrCanvas || !currentInfo) return;
  const W = 640, pad = 40, qrSize = 420;
  const c = document.createElement("canvas");
  const ctx = c.getContext("2d");
  ctx.font = "700 30px sans-serif";
  const topicLines = wrapText(ctx, currentInfo.topics.join(", "), W - pad * 2);
  const H = pad + topicLines.length * 38 + 70 + qrSize + pad;
  c.width = W; c.height = H;
  ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = "#17212b"; ctx.textAlign = "center";
  ctx.font = "700 30px sans-serif";
  let y = pad + 30;
  topicLines.forEach((l) => { ctx.fillText(l, W / 2, y); y += 38; });
  ctx.fillStyle = "#5b6876"; ctx.font = "400 22px sans-serif";
  ctx.fillText(metaText(currentInfo), W / 2, y + 6);
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(qrCanvas, (W - qrSize) / 2, y + 40, qrSize, qrSize);
  const a = document.createElement("a");
  a.href = c.toDataURL("image/png");
  a.download = "attendance-qr-" + slug(currentInfo.trainer) + "-" + currentInfo.date + ".png";
  a.click();
});

$("copy").addEventListener("click", async () => {
  try {
    await navigator.clipboard.writeText(currentUrl);
    $("copied").hidden = false;
  } catch (e) {
    window.prompt("Copy this link:", currentUrl);
  }
});

init();
</script>
</body>
</html>
